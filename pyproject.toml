[project]
name = "realread"
version = "0.1.0"
description = "Let AI agents read the papers you already have access to, through your own logged-in browser, politely."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ares", email = "80300117+Ares960826@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "literature-review", "full-text", "research", "agent", "ezproxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "filelock>=3.16",
    "mcp>=2.3.0",
    "platformdirs>=4.3",
    "playwright>=1.50",
    "pymupdf>=1.25",
    "trafilatura>=2.0",
]

[project.scripts]
realread = "realread.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = ["browser: needs a local Chrome (run with -m browser)"]
addopts = "-m 'not browser'"
